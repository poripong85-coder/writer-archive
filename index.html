<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>귤껍질 · 매일의 인사이트 조각</title>
<meta name="description" content="하루 동안 떠오른 생각과 링크, 사진을 자유롭게 적어두면 자정에 하루치 인사이트 조각으로 아카이브됩니다." />
<meta name="theme-color" content="#F97F1C" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#17130F" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="귤껍질" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/icon.svg" />
<link rel="stylesheet" href="styles/app.css" />
</head>
<body>
  <div id="app" class="app" data-view="today">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">🍊</span>
        <span class="brand-text">
          <strong>귤껍질</strong>
          <em id="brand-sub">오늘의 조각</em>
        </span>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="btn-search" type="button" title="검색 (Ctrl+K)" aria-label="검색">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        </button>
        <button class="icon-btn" id="btn-settings" type="button" title="설정" aria-label="설정">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.5 1.5M16.5 16.5L18 18M18 6l-1.5 1.5M7.5 16.5L6 18"/></svg>
        </button>
      </div>
    </header>

    <main id="main" class="main" tabindex="-1"></main>

    <nav class="tabbar" role="tablist" aria-label="화면 전환">
      <button class="tab" data-tab="today" role="tab" aria-selected="true" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 18.5V7.8c0-1 .8-1.8 1.8-1.8h11.4c1 0 1.8.8 1.8 1.8v6.4L14.6 19H6.3c-1 0-1.8-.8-1.8-1.8z"/><path d="M19.5 14.2h-3.4c-.8 0-1.5.7-1.5 1.5V19"/></svg>
        <span>오늘</span>
      </button>
      <button class="tab" data-tab="calendar" role="tab" aria-selected="false" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.2"/><path d="M3.5 9.6h17M8 3.5v3M16 3.5v3"/></svg>
        <span>달력</span>
      </button>
      <button class="tab" data-tab="fragments" role="tab" aria-selected="false" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.6l3 3.2 4.4.6-2.4 3.4 1 4.3-4-1.4-4 2.3.2-4.5-3.4-3 4.2-1.4z"/></svg>
        <span>조각</span>
      </button>
    </nav>
  </div>

  <div id="overlays"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <noscript>
    <p style="padding:24px;font:16px/1.6 system-ui">귤껍질은 자바스크립트가 필요합니다. 브라우저에서 자바스크립트를 켜주세요.</p>
  </noscript>

  <script type="module" src="app/main.js"></script>
</body>
</html>
